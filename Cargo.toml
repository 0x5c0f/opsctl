[workspace]
resolver = "2"
members = [
    "opsctl",
    "opsctl-cert",
    "opsctl-core",
    "opsctl-deploy",
    "opsctl-dns",
    "opsctl-notify",
]

[workspace.package]
edition = "2024"
version = "0.3.0-rc.2"
authors = ["0x5c0f"]
description = "opsctl — 统一运维工具集"
license = "Apache-2.0"
repository = "https://github.com/0x5c0f/opsctl"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
ureq = { version = "3", features = ["json"] }
toml = "0.8"
sha2 = "0.10"
dirs = "6"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
